{% extends "serene/templates/post.html" %}

{% block script %}
{{ super() }}
{% if '<pre class="mermaid">' in page.content %}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs';
  const v = (name) => getComputedStyle(document.body).getPropertyValue(name).trim();
  mermaid.initialize({
    startOnLoad: true,
    theme: 'base',
    darkMode: true,
    themeVariables: {
      background: v('--bg-color'),
      primaryColor: '#1e1e1e',
      primaryTextColor: v('--text-color'),
      primaryBorderColor: v('--primary-color'),
      lineColor: v('--text-pale-color'),
      fontFamily: v('--main-font'),
    },
  });
</script>
{% endif %}
{% endblock script %}

base_url = "https://zmerp.github.io"
title = "Z's blog"
description = "Z's blog"
theme = "serene"
compile_sass = true

[markdown]
external_links_no_follow = true
external_links_no_referrer = true
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
color_scheme = "dark"

name = "Z's blog"
links = [
  { name = "GitHub", icon = "github", url = "https://github.com/zmerp" },
  { name = "Email", icon = "email", url = "mailto:merp.zee@gmail.com" },
]
nav = [
  { name = "posts", path = "/posts" },
  { name = "projects", path = "/projects" },
  { name = "about", path = "/about" },
]
blog_section_path = "/posts"

back_link_text = "back"
footer_copyright = ""

not_found_error_text = "404 Not Found"
not_found_recover_text = "back_to_home()"

date_format = "%Y-%m-%d"
toc = true
code_copy = true
math = true
